name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build + test (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: build/ci-${{ matrix.config }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ matrix.config }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/ci-${{ matrix.config }} `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build/ci-${{ matrix.config }} --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build/ci-${{ matrix.config }} -C ${{ matrix.config }} --output-on-failure